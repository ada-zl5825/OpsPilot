name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Unit, contract, and security tests
        run: uv run pytest tests/unit tests/contract tests/security -q
      - name: Dataset integrity
        run: uv run python -m benchmarks.datasets.check_integrity
      - name: Offline benchmark gate
        run: uv run python -m benchmarks.cli --offline --gate
