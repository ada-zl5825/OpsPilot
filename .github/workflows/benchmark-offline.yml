name: benchmark-offline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Offline benchmark placeholder
        run: uv run pytest tests/benchmark -q
