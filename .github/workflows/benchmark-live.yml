name: benchmark-live

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard
        run: |
          echo "Live Azure benchmark is manual-only. Do not run on ordinary PRs."
          echo "Local: python -m benchmarks.cli --live --scenario S01"
          echo "Requires lab + holmes profiles and Azure credentials in .env."
          exit 0
