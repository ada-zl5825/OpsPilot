# Phase 0: postgres is always on. Holmes stays behind profile `holmes`.
# Phase 1: `docker compose --profile lab up -d --build`
# Never use floating :latest tags.

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5432:5432"
    volumes:
      - opspilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  opspilot-mcp:
    profiles: ["holmes"]
    build:
      context: ./mcp_servers/lab
    ports:
      - "8000:8000"
    environment:
      OPSPILOT_LAB_HOST: "0.0.0.0"
      OPSPILOT_LAB_PORT: "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  opspilot-observability:
    profiles: ["holmes"]
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile
    command: ["python", "-m", "mcp_servers.observability.server"]
    ports:
      - "8001:8001"
    environment:
      OPSPILOT_MCP_HOST: "0.0.0.0"
      OPSPILOT_MCP_PORT: "8001"
      OPSPILOT_MCP_BACKEND: live
      OPSPILOT_ARTIFACT_DIR: /tmp/opspilot-artifacts
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      LAB_CONTROLLER_URL: http://controller:8090
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8001), 3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  opspilot-deployments:
    profiles: ["holmes"]
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile
    command: ["python", "-m", "mcp_servers.deployments.server"]
    ports:
      - "8002:8002"
    environment:
      OPSPILOT_MCP_HOST: "0.0.0.0"
      OPSPILOT_MCP_PORT: "8002"
      OPSPILOT_MCP_BACKEND: live
      OPSPILOT_ARTIFACT_DIR: /tmp/opspilot-artifacts
      CHECKOUT_URL: http://checkout:8081
      PAYMENT_URL: http://payment:8082
      GATEWAY_URL: http://gateway:8080
      INVENTORY_URL: http://inventory:8083
      NOTIFICATION_URL: http://notification:8084
      LAB_CONTROLLER_URL: http://controller:8090
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8002), 3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  opspilot-runbooks:
    profiles: ["holmes"]
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile
    command: ["python", "-m", "mcp_servers.runbooks.server"]
    ports:
      - "8003:8003"
    environment:
      OPSPILOT_MCP_HOST: "0.0.0.0"
      OPSPILOT_MCP_PORT: "8003"
      OPSPILOT_ARTIFACT_DIR: /tmp/opspilot-artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8003), 3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  opspilot-remediation:
    profiles: ["holmes"]
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile
    command: ["python", "-m", "mcp_servers.remediation.server"]
    ports:
      - "8004:8004"
    environment:
      OPSPILOT_MCP_HOST: "0.0.0.0"
      OPSPILOT_MCP_PORT: "8004"
      OPSPILOT_ARTIFACT_DIR: /tmp/opspilot-artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8004), 3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  holmes:
    image: robustadev/holmes:0.39.0
    profiles: ["holmes"]
    depends_on:
      opspilot-mcp:
        condition: service_started
      opspilot-observability:
        condition: service_started
      opspilot-deployments:
        condition: service_started
      opspilot-runbooks:
        condition: service_started
      opspilot-remediation:
        condition: service_started
    ports:
      - "5050:5050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOLMES_HOST: "0.0.0.0"
      HOLMES_PORT: "5050"
      MODEL_LIST_FILE_LOCATION: /etc/holmes/model_list.yaml
      AZURE_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_API_BASE: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      HOLMES_MODEL: azure/${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      OVERRIDE_MAX_OUTPUT_TOKEN: "4096"
      OVERRIDE_MAX_CONTENT_SIZE: "128000"
      LOG_LEVEL: INFO
    volumes:
      - ./config/holmes/config.yaml:/root/.holmes/config.yaml:ro
      - ./config/holmes/model_list.yaml:/etc/holmes/model_list.yaml:ro
    # Image default ENTRYPOINT is the CLI. Override to the HTTP server.
    entrypoint: ["python", "-u", "server.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5050/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  redis:
    profiles: ["lab"]
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    profiles: ["lab"]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./simulator/telemetry/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3100/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  tempo:
    profiles: ["lab"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./simulator/telemetry/tempo.yaml:/etc/tempo.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3200/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  otel-collector:
    profiles: ["lab"]
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./simulator/telemetry/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    profiles: ["lab"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./simulator/telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
      - checkout
      - payment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9090/-/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory:
    profiles: ["lab"]
    build:
      context: ./simulator
    command:
      [
        "uvicorn",
        "simulator.services.inventory.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8083",
      ]
    environment: &lab-app-env
      SERVICE_NAME: inventory
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://opspilot:opspilot@postgres:5432/opspilot
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8083:8083"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck: &lab-python-health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  notification:
    profiles: ["lab"]
    build:
      context: ./simulator
    command:
      [
        "uvicorn",
        "simulator.services.notification.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8084",
      ]
    environment:
      <<: *lab-app-env
      SERVICE_NAME: notification
    ports:
      - "8084:8084"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *lab-python-health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/healthz')",
        ]

  payment:
    profiles: ["lab"]
    build:
      context: ./simulator
    command:
      [
        "uvicorn",
        "simulator.services.payment.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8082",
      ]
    environment:
      <<: *lab-app-env
      SERVICE_NAME: payment
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *lab-python-health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/healthz')",
        ]

  checkout:
    profiles: ["lab"]
    build:
      context: ./simulator
    command:
      [
        "uvicorn",
        "simulator.services.checkout.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8081",
      ]
    environment:
      <<: *lab-app-env
      SERVICE_NAME: checkout
      SERVICE_VERSION: "1.4.1"
      DB_POOL_MAX: "3"
      PAYMENT_TIMEOUT_SEC: "2.0"
      CACHE_DELAY_SEC: "2.0"
      CHECKOUT_URL: http://checkout:8081
      PAYMENT_URL: http://payment:8082
      INVENTORY_URL: http://inventory:8083
      NOTIFICATION_URL: http://notification:8084
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment:
        condition: service_started
      inventory:
        condition: service_started
      notification:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *lab-python-health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')",
        ]

  gateway:
    profiles: ["lab"]
    build:
      context: ./simulator
    command:
      [
        "uvicorn",
        "simulator.services.gateway.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]
    environment:
      <<: *lab-app-env
      SERVICE_NAME: gateway
      CHECKOUT_URL: http://checkout:8081
      PAYMENT_URL: http://payment:8082
      INVENTORY_URL: http://inventory:8083
      NOTIFICATION_URL: http://notification:8084
    ports:
      - "8080:8080"
    depends_on:
      checkout:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *lab-python-health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]

  controller:
    profiles: ["lab"]
    build:
      context: ./simulator
    command:
      [
        "uvicorn",
        "simulator.services.controller.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
      ]
    environment:
      <<: *lab-app-env
      SERVICE_NAME: controller
    ports:
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *lab-python-health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')",
        ]

  traffic:
    profiles: ["lab"]
    build:
      context: ./simulator
    command: ["python", "-m", "simulator.services.traffic.main"]
    environment:
      <<: *lab-app-env
      SERVICE_NAME: traffic
      GATEWAY_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_started

volumes:
  opspilot_pg:
