[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot Incident Lab — auditable multi-tool incident response, controlled remediation, and agent trajectory evaluation on HolmesGPT"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "李智峰" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "responses>=0.25",
]

[project.scripts]
opspilot = "opspilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "mcp_servers", "benchmarks", "simulator"]
extend-exclude = ["OpsPilot_完整开发技术文档.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: needs a running Holmes container",
    "lab: needs the Phase 1 simulator compose stack",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opspilot"]
mypy_path = "src"

[tool.uv]
package = true
